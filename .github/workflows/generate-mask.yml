name: Generate OSM Base Mask

on:
  workflow_dispatch: # This allows you to manually trigger the script from the Actions tab

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Run generation script
        run: npm run generate

      - name: Commit and push the mask
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-generate OSM base mask"
          file_pattern: "osm-base-mask.json"